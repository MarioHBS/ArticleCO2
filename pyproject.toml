[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
# A regex preceded by ^/ will apply only to files and directories
# in the root of the project.
(
    ^/data/
    | ^/.venv/
    | ^/.env/
    | ^/build/
    | ^/dist/
)
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
force_single_line = true
no_lines_before = ["LOCALFOLDER"]
known_first_party = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "serra-penitente-analysis/tests",
    "mapbiomas-alert-api/tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m 'not slow'')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "mapbiomas: marks tests related to MapBiomas API",
    "serra_penitente: marks tests related to Serra Penitente analysis",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::FutureWarning:statsmodels.*",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

# Exclude directories
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".env",
    "build",
    "dist",
    "*.egg-info",
    "results",
    "logs",
    "resultados_fixos",
    "serra-penitente-analysis/data/generated",
    "serra-penitente-analysis/data/downloads",
    "serra-penitente-analysis/data/archive",
    ".pytest_cache",
    ".trae",
]

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]

# Ignore specific rules
ignore = [
    "E501",  # line too long
    "S101",  # use of assert
    "T201",  # print statements
    "T203",  # pprint statements
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "C901",  # complex structure
    "PLR2004", # magic value used in comparison
    "BLE001", # blind exception catching
    "FBT002", # boolean default positional argument
    "PLC0415", # import should be at top-level
    "RET504", # unnecessary variable assignment before return
    "PLR0911", # too many return statements
    "PLW2901", # redefined loop variable
    "SIM108", # use ternary operator
    "UP007",  # use X | Y for type annotations
    "EM102",  # exception must not use f-string literal
    "TRY003", # avoid specifying long messages outside exception class
    "TRY300", # consider moving statement to else block
    "F841",   # local variable assigned but never used
    "COM812", # trailing comma missing
    "ISC001", # implicitly concatenated string literals
    "G004",   # logging statement uses f-string
    "DTZ005", # timezone-naive datetime
    "DTZ007", # datetime.strptime without timezone
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument
    "ARG002", # unused method argument
    "FBT001", # boolean positional argument in function definition
    "EM101",  # exception must not use string literal
    "PTH123", # open() should be replaced by Path.open()
    "ERA001", # found commented-out code
    "N806",   # variable in function should be lowercase
    "B905",   # zip() without explicit strict parameter
    "SIM102", # use a single if-statement
    "SIM117", # combine multiple isinstance checks
    "PTH100", # os.path.abspath() should be replaced by Path.resolve()
    "PTH120", # os.path.dirname() should be replaced by Path.parent
    "N999",   # invalid module name
    "PD901",  # pandas-df-variable-name
    "TRY401", # verbose-log-message
    "PTH118", # os-path-join
    "PTH103", # os-makedirs
    "RUF001", # ambiguous-unicode-character-string
    "TRY301", # raise-within-try
    "FBT003", # boolean-positional-value-in-call
    "RUF003", # ambiguous-unicode-character-comment
    "RUF005", # collection-literal-concatenation
    "RUF002", # ambiguous-unicode-character-docstring
    "PD011",  # pandas-use-of-dot-values
    "PTH110", # os-path-exists
    "PD010",  # pandas-use-of-dot-pivot-or-unstack
    "PD015",  # pandas-use-of-pd-merge
    "A004",   # builtin-import-shadowing
    "B007",   # unused-loop-control-variable
    "N803",   # invalid-argument-name
    "PD002",  # pandas-use-of-inplace-argument
    "UP038",  # non-pep604-isinstance
]

# Allow unused variables when they start with an underscore
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**" = ["F401", "F811", "S101", "PLR2004"]
"serra-penitente-analysis/src/**" = ["T201", "T203"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
# Use single quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"
